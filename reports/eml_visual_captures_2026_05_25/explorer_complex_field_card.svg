<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Generated static capture card for Explorer complex field view">
  <rect width="960" height="540" fill="#07080f"/>
  <rect x="48" y="44" width="864" height="452" rx="18" fill="#0d0e1c" stroke="#191b2e"/>
  <text x="80" y="92" fill="#e8a020" font-family="monospace" font-size="22" font-weight="700">Explorer Complex Field</text>
  <text x="80" y="124" fill="#cdd0e0" font-family="monospace" font-size="15">Phase color, magnitude contours, and EML slice intuition</text>
  <defs>
    <radialGradient id="field" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f5b24b"/>
      <stop offset="28%" stop-color="#77e3a4"/>
      <stop offset="52%" stop-color="#71d6ff"/>
      <stop offset="76%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </radialGradient>
  </defs>
  <rect x="80" y="156" width="310" height="310" rx="14" fill="url(#field)" stroke="#191b2e"/>
  <circle cx="235" cy="311" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <line x1="80" y1="311" x2="390" y2="311" stroke="#ffffff" stroke-opacity="0.35"/>
  <line x1="235" y1="156" x2="235" y2="466" stroke="#ffffff" stroke-opacity="0.35"/>
  <rect x="430" y="156" width="390" height="72" rx="12" fill="#07080f" stroke="#191b2e"/>
  <text x="456" y="187" fill="#e8a020" font-family="monospace" font-size="15">f(z) = eml(z, 1)</text>
  <text x="456" y="212" fill="#6f738a" font-family="monospace" font-size="12">same periodic phase behavior as exp(z)</text>
  <rect x="430" y="248" width="390" height="72" rx="12" fill="#07080f" stroke="#191b2e"/>
  <text x="456" y="279" fill="#e8a020" font-family="monospace" font-size="15">f(z) = eml(z, z + 2)</text>
  <text x="456" y="304" fill="#6f738a" font-family="monospace" font-size="12">shifted log branch creates a visible defect</text>
  <rect x="430" y="340" width="390" height="72" rx="12" fill="#07080f" stroke="#191b2e"/>
  <text x="456" y="371" fill="#5ec47a" font-family="monospace" font-size="15">Field -&gt; IR bridge</text>
  <text x="456" y="396" fill="#6f738a" font-family="monospace" font-size="12">visual intuition links back to inspectable bytecode</text>
  <text x="80" y="500" fill="#6f738a" font-family="monospace" font-size="12">GENERATED_STATIC_CAPTURE_CARD - not a runtime screenshot</text>
