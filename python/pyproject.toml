[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monogate"
version = "2.5.0"
description = "EML arithmetic — all elementary functions from eml(x,y) = exp(x) − ln(y) — with universality witness, CLI, and Jupyter integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Monogate Research" }]
requires-python = ">=3.10"
# numpy is required by leaderboard / search / complex_search submodules
# imported eagerly from monogate/__init__.py. Promoted from the [dev]
# extra to a hard dep in 2.4.2 — installs without it were silently
# broken ("ModuleNotFoundError: numpy" on `import monogate`).
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch     = ["torch>=2.0"]
llm       = ["openai>=1.0", "groq>=0.4", "anthropic>=0.20"]
sympy     = ["sympy>=1.12"]
streamlit = ["streamlit>=1.32", "matplotlib>=3.8", "numpy>=1.24", "pandas>=2.0"]
docs      = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.20"]

# 2.4.0 extras — unify the eml-* substrate as optional capabilities.
# Pure-Python pieces (witness, explore CLI, jupyter) live inside
# monogate now; the remaining eml-* packages stay as separate
# PyPI dependencies installed via these extras.
witness = [
    "sympy>=1.12",
    "eml-cost>=0.2.0",
    "eml-rewrite>=0.4.0",
    "eml-discover>=0.2.0",
    # Pin matching upstream hotfix so the strict EML-class check
    # for verified_in_lean is consistent across import paths.
    "eml-witness>=0.2.1",
]
cli = [
    "monogate[witness]",
    "eml-graph>=0.1.0",
]
jupyter = [
    "monogate[witness]",
    "ipython>=8.0",
]
all = [
    "monogate[cli,jupyter,torch,sympy]",
]

dev = [
    "pytest>=7",
    # pytest-xdist: -n auto in [tool.pytest.ini_options].addopts
    # parallelises this suite's ~509 test files across logical CPUs.
    # 453 of those files invoke a CLI script via subprocess.run, so
    # the wallclock is dominated by Python interpreter startup
    # (~100ms per subprocess × 453 tests = ~45s of pure overhead
    # serially). xdist spreads that across cores, expected ~5-10×
    # wallclock improvement on a multi-core box (measured pattern
    # on efrog 2026-06-11: 3m47s → 1m05s, 3.5×).
    "pytest-xdist>=3.5",
    "torch>=2.0",
    "mpmath>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "monogate[cli,jupyter]",
]

[project.scripts]
monogate-optimize        = "monogate.llm.cli:main"
monogate-validate        = "monogate.validate:main"
monogate-capability-card = "monogate.cli.capability_card:main"
monogate-explore         = "monogate.cli.explore:main"
# Compatibility alias — old eml-explore script keeps working when
# users install monogate with the [cli] extra.
eml-explore              = "monogate.cli.explore:main"

[project.urls]
Homepage   = "https://monogate.dev"
Repository = "https://github.com/agent-maestro/monogate"
Paper      = "https://arxiv.org/abs/2603.21852"

[tool.setuptools.packages.find]
where = ["."]
include = ["monogate*"]
exclude = ["monogate.frontiers*"]

[tool.setuptools.package-data]
monogate = ["data/*.json", "_routing.pkl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: pytest-xdist with one worker per logical CPU. The bulk
# of this suite (453 / 509 files as of 2026-06-11) invokes a CLI
# script through subprocess.run; each subprocess pays Python's
# cold-start cost (~100ms), so the suite is interpreter-overhead-
# bound when run serially. Tests are independent (each uses pytest's
# tmp_path fixture), so xdist parallelises without coordination.
# Override with `pytest -n 0` for serial debugging or
# `pytest -p no:xdist` to disable xdist entirely.
addopts = "-n auto"
