name: Blog Data Checks

# Push/PR validation for monogate.org (blog/). This does NOT deploy anything. Deploys stay manual and
# run `npm run predeploy` on the box that deploys (see blog/README.md).
#
# WHAT A GREEN RUN HERE DOES NOT MEAN. `npm run predeploy` also re-proves every Lean claim on the site
# (check:lean-claims) and runs the axiom-witness bridge (check:axiom-bridge). Neither can run on a
# GitHub-hosted runner: both need a built Lean + Mathlib toolchain, and the claims include files in
# the private monogate-research repository. So green here means only that these passed:
#   - the citation audit;
#   - the SuperBEST sync tests, which hold the site's table, its copy in python/results/, the capability
#     cards and the explorer's cost table to python/monogate/superbest.py;
#   - the /proofs quotation check;
#   - the build;
#   - the exhibit gates;
#   - the accountability gate.
# It does NOT mean the Lean claims were re-proved. That happens before every deploy, on the deploy box.
#
# History: this job ran `npm run predeploy` and failed on every push it ran for. It exited 2 inside
# predeploy before 2026-09-12. After that, the new Lean steps could not find ../../monogate-lean
# here. `npm run check:ci` is the part of predeploy that can run on this runner.
#
# The SuperBEST sync tests ran only by hand until 2026-09-13: pytest.yml and superbest.yml are
# workflow_dispatch-only, and both last ran on 2026-05-25. The python/ and explorer/ paths below are
# the files those tests read, so a change to any of them runs this job.

on:
  pull_request:
    paths:
      - 'blog/**'
      - '.github/workflows/blog-checks.yml'
      - 'python/monogate/superbest.py'
      - 'python/results/superbest_v5_table.json'
      - 'python/tests/test_superbest_canonical_sync.py'
      - 'python/tests/test_superbest_f16_constructions.py'
      - 'capability_card_public.json'
      - 'explorer/src/superbest.js'
  push:
    branches: [master, main]
    paths:
      - 'blog/**'
      - '.github/workflows/blog-checks.yml'
      - 'python/monogate/superbest.py'
      - 'python/results/superbest_v5_table.json'
      - 'python/tests/test_superbest_canonical_sync.py'
      - 'python/tests/test_superbest_f16_constructions.py'
      - 'capability_card_public.json'
      - 'explorer/src/superbest.js'
  workflow_dispatch:

jobs:
  audit-and-build:
    name: citation audit, /proofs quotes, build, exhibit gates (Lean claims are re-proved at deploy, not here)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Checkout monogate-lean (full history, so check_proofs_page.py can read the pinned commit)
        uses: actions/checkout@v6
        with:
          repository: agent-maestro/monogate-lean
          path: monogate-lean
          fetch-depth: 0

      - name: Checkout machlib (the citation audit resolves MachLib citations against it)
        uses: actions/checkout@v6
        with:
          repository: agent-maestro/machlib
          path: machlib

      - name: Place the sibling repos where blog/ looks for them (../../<repo>)
        run: |
          ln -s "$GITHUB_WORKSPACE/monogate-lean" "$GITHUB_WORKSPACE/../monogate-lean"
          ln -s "$GITHUB_WORKSPACE/machlib" "$GITHUB_WORKSPACE/../machlib"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        working-directory: blog
        run: npm ci

      - name: Install Firefox for the figure gate (check-figure-derives.mjs drives it through playwright-core)
        working-directory: blog
        run: npx playwright-core install --with-deps firefox

      - name: Set up Python (the SuperBEST sync tests, the /proofs check and the accountability gate)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the SuperBEST sync tests' Python dependencies
        run: python -m pip install numpy mpmath pytest

      - name: Citation audit, SuperBEST sync, /proofs quotes, build, exhibit gates (npm run check:ci)
        working-directory: blog
        env:
          MONOGATE_LEAN_PATH: ${{ github.workspace }}/monogate-lean
          MACHLIB_PATH: ${{ github.workspace }}/machlib
        run: npm run check:ci

      # Runs AFTER the build on purpose. This gate resolves /accountability's internal links against
      # dist/, so a link to an incident page that was never built fails here instead of 404-ing in
      # public. HTTP-checking the live site could not catch that, because the live site still serves
      # the previous build. External artifact URLs ARE fetched live, because the whole page is a claim
      # that they resolve.
      # Firing specimen (both directions): blog/scripts/ACCOUNTABILITY_GATE_SPECIMEN.md
      - name: Accountability gate (/accountability links, staleness, grade rigour)
        working-directory: blog
        run: python3 scripts/check_accountability.py
