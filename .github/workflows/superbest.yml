name: SuperBEST Surface Drift

on:
  workflow_dispatch:

jobs:
  superbest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: explorer/package-lock.json

      - name: Install Python package + dev deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run SuperBEST surface drift check
        run: |
          make superbest-check
          make superbest-dag-optimizer
          make superbest-expression-frontier
          make superbest-dag-lowering
          make superbest-lowering-ui
          make superbest-primitive-frontier
