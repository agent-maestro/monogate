name: EML Guard Contract

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  guard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install guard dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
      - name: Run guard fixtures and analyzer
        run: |
          python python/scripts/eml_a9_1_guard_rule_fixtures.py --build --strict
          python python/scripts/eml_a9_2_guard_decision_analyzer.py --build --strict
          python python/scripts/eml_a9_3_guard_ci_contract.py --build --strict
          python python/scripts/eml_a10_expression_guard_lens.py --build --strict
          python python/scripts/eml_a10_2_validate_builder_draft.py python/fixtures/eml_expression_packets/softplus_pair_v0.json --build --strict
          python python/scripts/eml_a11_mock_compiler_decision.py --build --strict
          python python/scripts/eml_a11_1_mock_compiler_holdouts.py --build --strict
          python python/scripts/eml_a11_2_protected_lowering_benchmark.py --build --strict
          python python/scripts/eml_a11_3_builder_export_feedback.py --build --strict
      - name: Validate proof-carrying artifact contracts
        run: |
          python python/scripts/proof_carrying_artifact_contract_validator.py --contracts-dir reports/proof_carrying_artifacts --strict
      - name: Run guard tests
        run: |
          python -m pytest -q \
            python/tests/test_eml_a9_1_guard_rule_fixtures.py \
            python/tests/test_eml_a9_2_guard_decision_analyzer.py \
            python/tests/test_eml_a9_3_guard_ci_contract.py \
            python/tests/test_eml_a10_expression_guard_lens.py \
            python/tests/test_eml_a10_2_validate_builder_draft.py \
            python/tests/test_eml_a11_mock_compiler_decision.py \
            python/tests/test_eml_a11_1_mock_compiler_holdouts.py \
            python/tests/test_eml_a11_2_protected_lowering_benchmark.py \
            python/tests/test_eml_a11_3_builder_export_feedback.py \
            python/tests/test_proof_carrying_artifact_contract_validator.py
