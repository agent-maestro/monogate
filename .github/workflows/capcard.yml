name: CapCard Verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install capcard-ai
        run: pip install capcard-ai

      - name: Verify capability card
        run: capcard verify capability_card_public.json
